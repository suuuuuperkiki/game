function drawTitle() {

  txt('강철 함대를 뚫고 군도의 하늘을 되찾아라', W / 2, y + size * .68 + 40, min(26, W * .04), CREAM, F_UI, 'center', 5);

  ctx.globalAlpha = pa; txt(G.touch ? '화면을 터치해 출격' : '클릭하거나 Enter로 출격', W / 2, H * .82, 36, CREAM, F_DISPLAY, 'center', 7); ctx.globalAlpha = 1;
  const ci = clamp((t - 90) / 20, 0, 1); ctx.globalAlpha = ci;

function drawOverlayEnd(title, sub, col, prompt) {
  const t = ++G.overT;
  ctx.fillStyle = `rgba(20,26,51,${min(.72, t / 50)})`; ctx.fillRect(-80, -80, W + 160, H + 160);
  const s = easeOutBounce(min(1, t / 34));
  ctx.save(); ctx.translate(W / 2, H * .34); ctx.scale(s, s);
  txt(title, 0, 0, min(104, W * .15), col, F_DISPLAY, 'center', 9, CREAM); ctx.restore();
  if (t > 24) {
    const u = min(1, (t - 24) / 16);
    ctx.globalAlpha = u;

    txt(G.score.toLocaleString(), W / 2, H * .5, 58, GOLD, F_NUM, 'center', 7);
    txt(G.score >= G.hi && G.score > 0 ? '새 최고 기록!' : `최고 ${G.hi.toLocaleString()}`, W / 2, H * .5 + 54, 26, CREAM, F_UI);

    ctx.globalAlpha = 1;
  }
  if (t > 50) { ctx.globalAlpha = .65 + sin(t * .1) * .35; txt(prompt, W / 2, H * .74, 32, CREAM, F_DISPLAY, 'center', 6); ctx.globalAlpha = 1; }

function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.save();
  // 카메라: 흔들림·줌 펀치

  const s = drawBackground();
  drawSpeedAndWeather();
  if (G.state === 'title') { ctx.restore(); drawTitle(); return; }

  drawParticles(false);
  drawItems();
  drawBoss();
  enemies.forEach(drawEnemy);
  drawPlayer();
  drawForeSky(s);
  drawShots();
  drawLasers();
  drawEBullets();
  drawParticles(true);
  drawRings();
  drawTexts();
  ctx.restore();

  drawWarning();
  drawCard();
  drawTally();

    txt('일시정지', W / 2, H * .42, 80, CREAM, F_DISPLAY, 'center', 8);

  } else if (G.state === 'victory') {

/* ───────────── 메인 루프 ───────────── */
const STEP = 1000 / 60;
let last = 0, acc = 0;
function tick() {
  if (G.state === 'title') { updateTitle(); return; }
  if (G.state === 'pause') return;

  if (G.hitstop > 0) { G.hitstop--; G.shake *= .92; return; }
  let ts = 1;
  if (G.slowT > 0) { G.slowT--; ts = G.slowV; }
  G.tsAcc += ts;
  while (G.tsAcc >= 1) { G.tsAcc -= 1; update(); }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = min(now - last, 100); last = now; acc += dt;
  let n = 0;
  while (acc >= STEP && n < 5) { acc -= STEP; tick(); n++; }
  if (n === 5) acc = 0;
  if (G.state !== 'pause') musicStep();
  render();
}

/* ───────────── 입력 ───────────── */
function pos(e) {
  const r = cv.getBoundingClientRect();
  if (!(r.width > 0 && r.height > 0)) return { x: P.tx, y: P.ty };
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function pauseToggle() {

  else if (G.state === 'pause') { G.state = 'play'; if (A.c) A.c.resume(); A.next = A.c ? A.c.currentTime + .05 : 0; }
}

  initAudio();

}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus();

  if (isTouch) G.touch = true;

});
addEventListener('pointermove', e => {
  const q = pos(e);
  if (e.pointerType === 'mouse') { mode = 'mouse'; P.tx = clamp(q.x, 26, W - 26); P.ty = clamp(q.y, 50, H - 40); ptr = q; }
  else if (drag && e.pointerId === drag.id) { mode = 'touch'; P.tx = clamp(drag.tx + (q.x - drag.x) * 1.25, 26, W - 26); P.ty = clamp(drag.ty + (q.y - drag.y) * 1.25, 50, H - 40); }

const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);

addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(c)) e.preventDefault();
  if (e.repeat) return;
  keys[c] = true;
  if (c === 'Enter') { primaryAction(); return; }
  if (c === 'KeyP' || c === 'Escape') { pauseToggle(); return; }
  if (c === 'KeyM') { setMute(!A.muted); return; }
  if (G.state !== 'play') { if (c === 'Space') primaryAction(); return; }
  if (c === 'ShiftLeft' || c === 'ShiftRight' || c === 'KeyZ') { mode = 'keys'; doRoll(); }
  if (c === 'KeyX' || c === 'Space') { mode = 'keys'; doBomb(); }

addEventListener('keyup', e => { keys[e.code] = false; });

// 한글 웹폰트를 미리 불러와 첫 프레임의 글자 교체를 줄임
if (document.fonts && document.fonts.load) {
  ['붉은 제비 경고 스테이지 돌파 격추됨 함대 격파', '일시정지 콤보 화력'].forEach(s => {
    document.fonts.load(`40px "Black Han Sans"`, s).catch(() => {});
    document.fonts.load(`24px "Do Hyeon"`, s + '클릭하거나 방향키 이동 자동 사격').catch(() => {});
  });
  document.fonts.load('24px Bungee', '0123456789').catch(() => {});
}
titlePlane.x = W / 2; titlePlane.y = H * .66;
P.x = W / 2; P.y = H * .78;
window.__redSwallow = { G, P, get enemies() { return enemies; }, get ebullets() { return ebullets; }, startBoss, doBomb, doRoll, tick: (n, noRender) => { for (let i = 0; i < n; i++) tick(); if (!noRender) render(); } };

})();
