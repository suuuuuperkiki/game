<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Russo+One&display=swap">
<style>

<script>
'use strict';
(() => {
/* ───────────── 도구 ───────────── */

const glowCache = {};

/* ───────────── 물리 상수 ───────────── */

const G = { state: 'title', t: 0, score: 0, shown: 0, pop: 0, best: +(load('rooftop-best') || 0), dist: 0, kills: 0, combo: 0, comboT: 0, maxCombo: 0, camX: 0, camY: 0, shake: 0, flash: 0, flashCol: '#fff', zoom: 0, hitstop: 0, slowT: 0, slowV: 1, tsAcc: 0, overT: 0, card: null, zone: 0, lightning: 0, bolt: null, deathT: 0, deathCause: '', touch: false, hint: 0, demo: false };
const P = { x: 0, y: 0, vx: 0, vy: 0, ground: false, coyote: 0, buffer: 0, jumps: 1, dash: 0, dashCd: 0, dashOK: true, wall: false, kickLock: 0, hp: 3, inv: 0, sx: 1, sy: 1, flip: 0, flipV: 0, phase: 0, ghosts: [], scarf: [], slash: 0, alive: true, lastTop: 400, held: false, landed: 0, spin: 0 };
const C = { x: -700 }; // 붕괴 전선

const SIGNS = ['24시', '분식', '노래방', '당구', '여관', '오락실', '약국', '국밥', '만화방', '수리', '호프', '사우나', '전당포', '다방'];

/* ───────────── 사운드 ───────────── */
const A = { c: null, master: null, muted: load('rooftop-mute') === '1', noise: null, next: 0, step: 0, last: {} };

}
function tone(f, d, type = 'square', v = .1, slide = 0, at = 0) { if (!A.c) return; const t = A.c.currentTime + at, o = A.c.createOscillator(), g = A.c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(max(20, f + slide), t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0008, t + d); o.connect(g); g.connect(A.master); o.start(t); o.stop(t + d + .02); }

const SFX = {
  jump() { tone(320, .13, 'square', .04, 340); },
  jump2() { tone(520, .15, 'square', .04, 500); noise(.12, .05, 3000, 'highpass'); },
  kick() { tone(240, .1, 'square', .05, 400); noise(.08, .1, 900, 'bandpass'); },
  dash() { noise(.22, .18, 700, 'bandpass', 5000); tone(1200, .1, 'sawtooth', .025, -600); },
  slash() { noise(.1, .22, 5000, 'highpass'); tone(190, .14, 'sawtooth', .1, -120); },
  land() { noise(.08, .07, 400); },
  coin() { const k = 'c'; if (A.last[k] && G.t - A.last[k] < 3) return; A.last[k] = G.t; tone(1400 + min(600, G.combo * 40), .05, 'square', .022); tone(1860 + min(600, G.combo * 40), .08, 'square', .022, 0, .04); },
  hurt() { noise(.3, .3, 1500, 'lowpass', 200); tone(300, .28, 'sawtooth', .1, -200); },
  shoot() { tone(900, .1, 'sawtooth', .025, -500); },
  crumble() { noise(.5, .16, 500, 'lowpass', 80); },

    const at = A.next - A.c.currentTime, s = A.step % 32, root = [55, 65.4, 49, 73.4][floor(A.step / 64) % 4], play = G.state === 'play';

/* ───────────── 이펙트 ───────────── */
function part(kind, x, y, vx, vy, life, size, o) { if (parts.length > 900) return; const p = { kind, x, y, vx, vy, life, max: life, size, drag: .96, grav: 0, rot: rnd(TAU), vr: rnd(-.3, .3), col: '#fff' }; if (o) Object.assign(p, o); parts.push(p); }

const slow = (f, v) => { G.slowT = f; G.slowV = v; };
function dust(x, y, n = 8, dir = 0) { for (let i = 0; i < n; i++) { const a = rnd(PI) + PI; part('dust', x + rnd(-10, 10), y - 2, cos(a) * rnd(.5, 3) + dir, sin(a) * rnd(.3, 1.4), rnd(14, 26), rnd(4, 9), {}); } }

/* ───────────── 절차 생성 ───────────── */
function roof(x, w, y, kind = 'roof', o) { const r = { x, w, y, kind, shake: 0, fall: 0, fv: 0, crumbling: 0, windows: floor(rnd(1e6)), tone: floor(rnd(3)), decor: [], broken: false, sign: null }; if (o) Object.assign(r, o); roofs.push(r); return r; }

}
function addCoinsLine(x0, y0, n, dx) { for (let i = 0; i < n; i++) coins.push({ x: x0 + i * dx, y: y0, t: rnd(100), got: false }); }
function addCoinsArc(x0, y0, x1, y1, h, n) { for (let i = 0; i <= n; i++) { const u = i / n, x = lerp(x0, x1, u), y = lerp(y0, y1, u) - sin(u * PI) * h; coins.push({ x, y, t: i * 8, got: false }); } }

function mkEnemy(type, x, y, r) { return { type, x, y, home: r, vx: 0, vy: 0, t: floor(rnd(100)), hp: type === 'brute' ? 2 : 1, flash: 0, dead: false, face: -1, cd: rnd(30, 90), tele: 0, stun: 0, by: y, hurtX: 0 }; }

}

/* ───────────── 조작 ───────────── */
function jumpPress() { P.buffer = 8; P.held = true; }
